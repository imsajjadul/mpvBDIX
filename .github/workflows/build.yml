name: CI/CD Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      build_flavor:
        description: APK flavor to build
        required: true
        default: standard
        type: choice
        options:
          - standard
          - all
          - dual
          - fongmi
          - no_vulkan

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SELECTED_FLAVOR: ${{ inputs.build_flavor || 'standard' }}

jobs:
  build:
    name: Build selected APK flavors
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # BuildConfig.GIT_COUNT and preview build identities rely on the real repository history.
          fetch-depth: 0

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build selected release APKs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "standard" ]]; then
            ./gradlew assembleStandardRelease --stacktrace --no-daemon --max-workers=2
          fi

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "fongmi" ]]; then
            ./gradlew assembleFongmiRelease --stacktrace --no-daemon --max-workers=2
          fi

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "no_vulkan" ]]; then
            ./gradlew assembleNoVulkanRelease --stacktrace --no-daemon --max-workers=2
          fi

      # ------------------------------------------------------------
      # TEST SIGNING
      #
      # A temporary keystore is generated for every CI run.
      # This is intended for personal/testing builds only.
      #
      # For production/release builds, use a permanent private
      # keystore stored in GitHub Secrets.
      # ------------------------------------------------------------
      - name: Generate temporary signing keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/mpvbdix-test.keystore"
          KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          KEY_ALIAS="mpvbdix-test"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=mpvBDIX Test, OU=Development, O=mpvBDIX, L=Dhaka, ST=Dhaka, C=BD"

          echo "TEST_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "TEST_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TEST_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TEST_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Sign APKs
        shell: bash
        run: |
          set -euo pipefail

          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [[ ! -x "$apksigner" ]]; then
            echo "ERROR: apksigner not found at:"
            echo "$apksigner"
            exit 1
          fi

          sign_apk() {
            local unsigned="$1"
            local signed="$2"
            local label="$3"

            if [[ ! -f "$unsigned" ]]; then
              echo "Missing expected $label APK:"
              echo "$unsigned"
              echo
              echo "Available APK files:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            echo "Signing $label..."

            "$apksigner" sign \
              --ks "$TEST_KEYSTORE" \
              --ks-key-alias "$TEST_KEY_ALIAS" \
              --ks-pass "pass:$TEST_KEYSTORE_PASSWORD" \
              --key-pass "pass:$TEST_KEY_PASSWORD" \
              --out "$signed" \
              "$unsigned"

            echo "Verifying $label..."

            "$apksigner" verify --verbose "$signed"

            rm -f "$unsigned"

            echo "Successfully signed: $signed"
          }

          # ----------------------------------------------------------
          # STANDARD
          # ----------------------------------------------------------
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "standard" ]]; then

            release_dir="app/build/outputs/apk/standard/release"

            test -d "$release_dir"

            architectures=(
              universal
              arm64-v8a
              armeabi-v7a
              x86
              x86_64
            )

            for abi in "${architectures[@]}"; do

              sign_apk \
                "$release_dir/app-standard-${abi}-release-unsigned.apk" \
                "$release_dir/app-standard-${abi}-release.apk" \
                "standard $abi release"

            done
          fi

          # ----------------------------------------------------------
          # FONGMI
          # ----------------------------------------------------------
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "fongmi" ]]; then

            flavor="fongmi"
            flavor_dir="app/build/outputs/apk/fongmi/release"

            test -d "$flavor_dir"

            sign_apk \
              "$flavor_dir/app-${flavor}-universal-release-unsigned.apk" \
              "$flavor_dir/app-${flavor}-universal-release.apk" \
              "$flavor universal release"

          fi

          # ----------------------------------------------------------
          # NO VULKAN
          # ----------------------------------------------------------
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "no_vulkan" ]]; then

            flavor="noVulkan"
            flavor_dir="app/build/outputs/apk/noVulkan/release"

            test -d "$flavor_dir"

            sign_apk \
              "$flavor_dir/app-${flavor}-universal-release-unsigned.apk" \
              "$flavor_dir/app-${flavor}-universal-release.apk" \
              "non-Vulkan universal release"

          fi

      - name: Verify expected flavor outputs
        shell: bash
        run: |
          set -euo pipefail

          # ----------------------------------------------------------
          # STANDARD
          # ----------------------------------------------------------
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "standard" ]]; then

            release_dir="app/build/outputs/apk/standard/release"

            architectures=(
              universal
              arm64-v8a
              armeabi-v7a
              x86
              x86_64
            )

            for abi in "${architectures[@]}"; do

              if ! compgen -G "$release_dir/app-standard-${abi}-release*.apk" >/dev/null; then
                echo "No standard release APK found for $abi"
                exit 1
              fi

            done
          fi

          # ----------------------------------------------------------
          # FONGMI
          # ----------------------------------------------------------
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "fongmi" ]]; then

            flavor="fongmi"
            flavor_dir="app/build/outputs/apk/fongmi/release"

            if ! compgen -G "$flavor_dir/app-${flavor}-universal-release*.apk" >/dev/null; then
              echo "No universal release APK found for $flavor"
              exit 1
            fi

            if find "$flavor_dir" -maxdepth 1 -type f -name "app-${flavor}-*-release*.apk" ! -name "app-${flavor}-universal-release*.apk" | grep -q .; then
              echo "$flavor produced an unexpected ABI-specific APK"
              find "$flavor_dir" -maxdepth 1 -type f -name '*.apk' -print
              exit 1
            fi

          fi

          # ----------------------------------------------------------
          # NO VULKAN
          # ----------------------------------------------------------
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "no_vulkan" ]]; then

            flavor="noVulkan"
            flavor_dir="app/build/outputs/apk/noVulkan/release"

            if ! compgen -G "$flavor_dir/app-${flavor}-universal-release*.apk" >/dev/null; then
              echo "No universal non-Vulkan release APK found"
              exit 1
            fi

            if find "$flavor_dir" -maxdepth 1 -type f -name "app-${flavor}-*-release*.apk" ! -name "app-${flavor}-universal-release*.apk" | grep -q .; then
              echo "The non-Vulkan flavor produced an unexpected ABI-specific APK"
              find "$flavor_dir" -maxdepth 1 -type f -name '*.apk' -print
              exit 1
            fi

          fi

      # --------------------------------------------------------------
      # UPLOAD STANDARD ARM64
      # --------------------------------------------------------------
      - name: Upload arm64-v8a APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-arm64-v8a-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # --------------------------------------------------------------
      # UPLOAD STANDARD ARM32
      # --------------------------------------------------------------
      - name: Upload armeabi-v7a APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-armeabi-v7a-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # --------------------------------------------------------------
      # UPLOAD UNIVERSAL
      # --------------------------------------------------------------
      - name: Upload universal APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-universal-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-universal-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # --------------------------------------------------------------
      # UPLOAD X86
      # --------------------------------------------------------------
      - name: Upload x86 APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-x86-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-x86-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # --------------------------------------------------------------
      # UPLOAD X86_64
      # --------------------------------------------------------------
      - name: Upload x86_64 APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-x86_64-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-x86_64-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # --------------------------------------------------------------
      # UPLOAD FONGMI
      # --------------------------------------------------------------
      - name: Upload Fongmi universal APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'fongmi' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-fongmi-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/fongmi/release/app-fongmi-universal-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # --------------------------------------------------------------
      # UPLOAD NO VULKAN
      # --------------------------------------------------------------
      - name: Upload non-Vulkan universal APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'no_vulkan' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-no-vulkan-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/noVulkan/release/app-noVulkan-universal-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0